<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Plugin Installer">
  <defs>
    <linearGradient id="pi-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2f5fd0"/>
    </linearGradient>
  </defs>
  <!-- 箱体：安装包 -->
  <path d="M10 22 L32 11 L54 22 L32 33 Z" fill="url(#pi-box)" opacity="0.95"/>
