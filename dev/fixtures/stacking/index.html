<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>清单下拉层级夹具（R36）</title>
<style>
  body{margin:0;font:14px/1.5 "Segoe UI",sans-serif;background:#e9eef5;color:#17212b}
  .dpi-panel{box-sizing:border-box;height:560px;width:1100px;margin:20px auto;padding:22px 24px;overflow:hidden;
    background:#fff;position:relative}
  /* 用静态 transform 模拟插件里 `.dpi-panel > *` 入场动画结束后的层叠上下文，保证复现确定 */
  .dpi-panel > *{transform:translateY(0)}
  .dpi-header{position:relative;z-index:30;display:flex;align-items:flex-start;justify-content:space-between;
    gap:14px;margin-bottom:18px}
  body.old .dpi-header{position:static;z-index:auto}
  .dpi-header-actions{display:flex;gap:7px;align-items:center}
  .dpi-menu-wrap{position:relative;display:inline-flex}
  .dpi-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:200;min-width:196px;padding:5px;
    display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid #c9d4e2;border-radius:10px;
    box-shadow:0 18px 42px -20px rgba(0,0,0,.62),0 2px 8px rgba(0,0,0,.16)}
  .dpi-menu-item{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border:0;background:transparent;
    font:inherit;font-size:12.5px;cursor:pointer;border-radius:7px}
  .dpi-menu-item:hover{background:#eef3f9}
  .dpi-card{border:1px solid #d7e0ea;background:#f7faff;border-radius:12px;padding:14px 15px;margin-bottom:12px}
  .dpi-composer{border:1px solid #c9d4e2;border-radius:14px;padding:18px;margin-bottom:14px;
    background:linear-gradient(180deg,#f4f8ff,#eef4fc)}
</style>
</head>
<body>
<div class="dpi-panel">
  <header class="dpi-header">
    <div><strong>插件 / Skill 安装</strong><div style="color:#7a8796;font-size:12px">DSH 0.2.1-rc.5 · desktop 档</div></div>
    <div class="dpi-header-actions">
      <button>设置</button>
      <div class="dpi-menu-wrap">
        <button id="menu-btn">清单 ▾</button>
        <div class="dpi-menu" id="menu">
          <button class="dpi-menu-item" id="item-plugins"><span>已装插件</span><span>48</span></button>
          <button class="dpi-menu-item" id="item-skills"><span>已装 Skill</span><span>58</span></button>
          <button class="dpi-menu-item" id="item-mcp"><span>已装 MCP</span><span>0</span></button>
        </div>
      </div>
      <button>刷新</button>
    </div>
  </header>
  <div class="dpi-composer">
    <div style="color:#6a7788">GitHub 链接 / Release 页 / .tgz·.zip 直链 / 本机绝对路径 / 包名</div>
    <div style="height:48px"></div>
  </div>
  <div class="dpi-card"><strong>插件更新</strong><div>48 个依赖 · 44 个在 bundle 行里</div></div>
  <div class="dpi-card"><strong>AI 推荐</strong><div>只有三件事：搜索 / 推荐 / 递安装请求</div></div>
</div>
<script>
  /* old=1 复现修复前（header 不是层叠上下文）；不带 query 是修复后（header z-index 30）。
     判定看 window.__stackResult.menuItemHit：old 应为 false，new 应为 true。 */
  if (new URLSearchParams(location.search).has("old")) document.body.classList.add("old");
  const rect = document.getElementById("item-plugins").getBoundingClientRect();
  const x = Math.round(rect.left + rect.width / 2);
  const y = Math.round(rect.top + rect.height / 2);
  const hit = document.elementFromPoint(x, y);
  const item = hit && hit.closest ? hit.closest(".dpi-menu-item") : null;
  window.__stackResult = {
    mode: document.body.classList.contains("old") ? "old" : "new",
    point: [x, y],
    hitTag: hit && hit.tagName,
    hitId: hit && hit.id,
    hitClass: hit && String(hit.className || "").slice(0, 80),
    menuItemHit: Boolean(item),
    itemId: item && item.id
  };
  document.title = "stack-" + window.__stackResult.mode + "-top:" + (item ? item.id : "covered");
  /* lemo-opuscar / lemofilm_stills 的约定 */
  window.READY = true;
  window.DUR = 1;
  window.render = () => {};
</script>
</body>
</html>
